<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão listas</title>
</head>
<body>
    <!--li para os itens da lista, ul para lista não ordenada-->
    <ul>
        <li>arroz</li>
        <li>feijão</li>
        <li>carne</li>
    </ul>
    <!--ol para lista ordenada-->
    <ol>
        <li>coloque os ingredientes</li>
        <li>misture bem</li>
        <li>sirva</li>
    </ol>
    <!--TABLE cria tabelas, e tr para criar as linhas da tabela-->
    <!--TH cria uma celula de titulo, TD cria uma celula de dados -->
    <table border="1">
        <tr>
            <th>Nome</th>
            <th>cpf</th>
        </tr>
        <tr>
            <td>Carlos</td>
            <td>40028922</td>
        </tr>
    </table>

</body>
</html>
