<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formularios</title>
</head>
<body>
    <form action="">
        <label for="campo_nome">nome: </label>
        <input type="text" id="campo_nome" name="nome" required minlength="2" maxlength="30" placeholder="Pedro Lopes">

        <label for="campo_email">email: </label>
        <input type="email" id="campo_email" nome="email" required>
        
        <label for="campo_data">data</label>
        <input type="date" id="campo_data" nome="data">
    
        <button type="submit">Enviar</button>
        <button type="reset">Limpar campos</button>
    </form>
</body>
</html>
