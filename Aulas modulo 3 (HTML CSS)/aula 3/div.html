<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div</title>
</head>
<body>
   <!--DIV cria um bloco onde pode se colocar as tags organizadas--> 
    <div>
        <h2>Titulo exemplo</h2>
        <p>Paragrafo de exemplo</p>

        <h1>Paragrafo exemplo 2</h1>
        <p>paragrafo de exemplo 2</p>
    </div>

   <!--SPAN separa uma parte do texto dentro de uma linha, como o div mas apenas na linha selecitionada-->

    <h2> Titulo exeplo</h2>
    <p>Texto genericoTexto <span> genericoTexto genericoTexto </span> generico
    Texto genericoTexto genericoTexto genericoTexto generico</p>

</body>
</html>
