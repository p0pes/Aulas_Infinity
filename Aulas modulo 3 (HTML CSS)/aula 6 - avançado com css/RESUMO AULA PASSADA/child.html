<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>last/first child</title>


    <style>
        p:first-child {
          color: red;
        }
        p:last-child {
          color: blue;
        }
      </style>
      
</head>
<body>
    <div>
        <p>Parágrafo 1</p>
        <p>Parágrafo 2</p>
        <span>Texto no meio</span>
        <p>Parágrafo 3</p>
      </div>
</body>
</html>
